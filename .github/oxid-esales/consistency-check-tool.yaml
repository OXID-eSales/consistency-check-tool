install:
  cache:
    prepared_shop: false
  composer:
    root_url: ''
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-component": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/apex-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/developer-tools": "{{ .Data.install.composer.dev_ref }}"
          }
      }
  custom_script_container: |
    sh -c 'echo "  -\n    resource: ../../services.yaml" >> var/generated/generated_services.yaml'
    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:theme:activate apex
    vendor/bin/oe-console oe:cache:clear

runscript: &runscript
  matrix:
    script: |
      [
        "report:tests-unit",
        "report:tests-integration"
      ]
  report:
    path: ''
  no_report:
    path: ''
    coverage_prefix: ''

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "report:phpstan-report",
        "no_report:phpmd-report",
        "no_report:phpcs-report"
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/'
  organization: 'oxid-esales'
  project_key: 'OXID-eSales_consistency-check-tool'
  project_name: 'oxid-esales/consistency-check-tool'
  target_branch: 'b-7.4.x'
  parameters: >
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests

finish:
  slack_title: 'consistency-check-tool ({{ .Data.install.git.ref }}) by {{ .Github.Actor }}'
