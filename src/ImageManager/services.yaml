imports:
  - { resource: Entity/services.yaml }

services:
  _defaults:
    public: false
    autowire: true

  OxidEsales\ConsistencyCheck\ImageManager\Utils\Finder:
    class: Symfony\Component\Finder\Finder
    factory: ['Symfony\Component\Finder\Finder', 'create']

  OxidEsales\ConsistencyCheck\ImageManager\Utils\FileSystemUtilsInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Utils\FileSystemUtils
    arguments:
      $finder: '@OxidEsales\ConsistencyCheck\ImageManager\Utils\Finder'

  OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageDataTypeFactoryInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageDataTypeFactory

  OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageCollectionFactoryInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageCollectionFactory

  OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDirectoryRepository:
    class: OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDirectoryRepository

  OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDatabaseRepository:
    class: OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDatabaseRepository

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageCheckerServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageCheckerService
    arguments:
      $imageDatabaseRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDatabaseRepository'
      $imageDirectoryRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDirectoryRepository'
      $imageCollectionFactory: '@OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageCollectionFactoryInterface'
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'

  OxidEsales\ConsistencyCheck\ImageManager\Logger:
    class: Monolog\Logger
    factory: [ '@OxidEsales\ConsistencyCheck\ImageManager\Logger\Factory', 'create' ]

  OxidEsales\ConsistencyCheck\ImageManager\Logger\Factory:
    class: OxidEsales\EshopCommunity\Internal\Framework\Logger\Factory\MonologLoggerFactory
    arguments:
      $configuration: '@OxidEsales\ConsistencyCheck\ImageManager\Logger\Configuration'

  OxidEsales\ConsistencyCheck\ImageManager\Logger\Configuration:
    class: OxidEsales\EshopCommunity\Internal\Framework\Logger\Configuration\MonologConfiguration
    arguments:
      $loggerName: 'Consistency Check Logger'
      $logFilePath: '%app.log_file_path%'
      $logLevel: !php/const Psr\Log\LogLevel::DEBUG

  OxidEsales\ConsistencyCheck\ImageManager\Factory\ProgressBarFactoryInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Factory\ProgressBarFactory

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterService

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerService

  OxidEsales\ConsistencyCheck\ImageManager\Service\MessageFormatterServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\MessageFormatterService

  OxidEsales\ConsistencyCheck\ImageManager\Console\MoveUnusedImagesCommand:
    arguments:
      $entities: !tagged_iterator 'oe.consistency_check.image_entity'
      $imageCheckerService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageCheckerServiceInterface'
      $imageManagerService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerServiceInterface'
      $entityFilterService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterServiceInterface'
      $progressBar: '@OxidEsales\ConsistencyCheck\ImageManager\Factory\ProgressBarFactoryInterface'
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'
    tags:
      - { name: 'console.command', command: 'oe.consistency_check:move-unused-images' }

  OxidEsales\ConsistencyCheck\ImageManager\Console\DeleteUnusedImagesCommand:
    arguments:
      $entities: !tagged_iterator 'oe.consistency_check.image_entity'
      $imageCheckerService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageCheckerServiceInterface'
      $imageManagerService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerServiceInterface'
      $entityFilterService: '@OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterServiceInterface'
      $progressBar: '@OxidEsales\ConsistencyCheck\ImageManager\Factory\ProgressBarFactoryInterface'
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'
    tags:
      - { name: 'console.command', command: 'oe.consistency_check:delete-unused-images' }